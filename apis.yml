aid: norwest-venture-partners
name: Norwest Venture Partners
description: >-
  Norwest Venture Partners is a multi-stage venture capital and growth equity
  investment firm founded in 1961 and headquartered in Menlo Park, California,
  with additional presence in San Francisco and subsidiaries in Mumbai, India
  and Tel Aviv, Israel. As of its 2024 NVP XVII fund ($3B), the firm manages
  more than $15.5 billion in capital and has backed over 700 companies across
  its history. Norwest invests across the full lifecycle — from early-stage
  venture through late-stage growth equity — with sector focus spanning
  enterprise and B2B SaaS, cloud and infrastructure, AI, fintech, healthcare
  and life sciences (including biotech and digital health), and consumer and
  lifestyle brands. The firm is known for a hands-on but non-intrusive partnership
  model, backing its founders with Portfolio Success programs across talent,
  operations, leadership, and go-to-market. Notable investments include Plaid,
  Uber, Spotify, Opendoor, Gong, Vuori, Kendra Scott, Casper, Udemy, Avetta,
  Adaptive Insights, YipitData, Babylist, Workato, and Veza.
